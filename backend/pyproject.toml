[project]
name = "headroom-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]==0.162.0",
    "httpx==0.28.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]
